<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hadiah.besar.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            animation: screenShake 0.1s infinite;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
            z-index: 999;
        }

        .glitch-container {
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 100%;
            padding: 20px;
        }

        .main-message {
            font-size: 4rem;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #ff0000,
                0 0 80px #ff0000;
            animation: glitch 0.3s infinite, colorCycle 2s infinite;
            margin-bottom: 20px;
            word-wrap: break-word;
            padding: 0 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .sub-message {
            font-size: 2.5rem;
            color: #0f0;
            text-shadow: 
                0 0 10px #0f0,
                0 0 20px #0f0,
                0 0 30px #0f0;
            margin-bottom: 30px;
            animation: flicker 0.05s infinite, textGlitch 0.2s infinite;
            word-wrap: break-word;
            padding: 0 10px;
            letter-spacing: 2px;
        }

        .warning-box {
            border: 3px solid #ff0000;
            padding: 8px 15px;
            background: rgba(255, 0, 0, 0.15);
            margin-top: 15px;
            animation: pulse 1s infinite, boxGlitch 0.5s infinite;
            max-width: 70%;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 
                0 0 20px rgba(255, 0, 0, 0.5),
                inset 0 0 20px rgba(255, 0, 0, 0.2);
        }

        .warning-text {
            font-size: 1.8rem;
            color: #ff0000;
            text-transform: uppercase;
            word-wrap: break-word;
            text-shadow: 0 0 10px #ff0000;
            animation: textFlicker 0.1s infinite;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        .skull {
            font-size: 8rem;
            margin: 15px 0;
            animation: shake 0.3s infinite, skullPulse 0.5s infinite;
            filter: drop-shadow(0 0 20px #ff0000);
        }

        @media (max-width: 768px) {
            .main-message {
                font-size: 2rem;
            }
            .sub-message {
                font-size: 1.2rem;
            }
            .skull {
                font-size: 4rem;
            }
            .warning-box {
                padding: 20px 30px;
            }
            .warning-text {
                font-size: 1rem;
            }
            .countdown {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .main-message {
                font-size: 1.5rem;
            }
            .sub-message {
                font-size: 1rem;
            }
            .skull {
                font-size: 3rem;
            }
            .warning-box {
                padding: 15px 20px;
            }
            .warning-text {
                font-size: 0.9rem;
            }
            .countdown {
                font-size: 1.5rem;
            }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            10% { transform: translate(-3px, -3px); }
            20% { transform: translate(3px, 3px); }
            30% { transform: translate(-3px, 3px); }
            40% { transform: translate(3px, -3px); }
            50% { transform: translate(-2px, 2px); }
            60% { transform: translate(2px, -2px); }
            70% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
            90% { transform: translate(-1px, 1px); }
            100% { transform: translate(0); }
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
        }

        @keyframes colorCycle {
            0% { color: #ff0000; text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff0000; }
            33% { color: #ff00ff; text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff; }
            66% { color: #ff6600; text-shadow: 0 0 10px #ff6600, 0 0 20px #ff6600, 0 0 40px #ff6600; }
            100% { color: #ff0000; text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff0000; }
        }

        @keyframes textGlitch {
            0% { opacity: 1; }
            50% { opacity: 0.9; }
            100% { opacity: 1; }
        }

        @keyframes boxGlitch {
            0% { border-color: #ff0000; }
            25% { border-color: #ff00ff; }
            50% { border-color: #ff6600; }
            75% { border-color: #00ff00; }
            100% { border-color: #ff0000; }
        }

        @keyframes textFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes skullPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes countdownGlitch {
            0% { transform: skewX(0deg); }
            25% { transform: skewX(1deg); }
            50% { transform: skewX(-1deg); }
            75% { transform: skewX(0.5deg); }
            100% { transform: skewX(0deg); }
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 2000;
        }

        .random-text {
            position: fixed;
            color: #0f0;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 50;
            opacity: 0.6;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px #ff0000; }
            50% { box-shadow: 0 0 40px #ff0000, 0 0 60px #ff0000; }
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .countdown {
            font-size: 3rem;
            color: #ff0000;
            margin-top: 20px;
            animation: pulse 0.5s infinite, countdownGlitch 0.2s infinite;
            max-width: 50%;
            margin-left: auto;
            margin-right: auto;
            text-shadow: 
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #ff0000;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
            text-align: center;
        }

        .code-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="code-rain" id="codeRain"></div>
    
    <div class="glitch-container">
        <div class="skull">💀</div>
        <div class="main-message">SELAMAT ANDA KENA HACK</div>
        <div class="sub-message">SISTEM ANDA TELAH DIBOBOL</div>
        
        <div class="warning-box">
            <div class="warning-text">⚠️ SISTEM DIBOBOL ⚠️</div>
            <div class="warning-text" style="margin-top: 15px;">DATA ANDA TELAH TEREKSPOS</div>
        </div>
        
        <div class="countdown" id="countdown">00:00:00</div>
    </div>

    <script>
        // Matrix rain effect
        const canvas = document.createElement('canvas');
        canvas.className = 'matrix-bg';
        document.body.appendChild(canvas);
        
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        // Countdown timer
        let seconds = 0;
        function updateCountdown() {
            seconds++;
            const hrs = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('countdown').textContent = `${hrs}:${mins}:${secs}`;
        }
        setInterval(updateCountdown, 1000);

        // Resize handler
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Scary ambient sound generator using Web Audio API
        let audioContext;
        let isPlaying = false;
        let oscillators = [];
        let gainNodes = [];

        function createScarySound() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Create multiple oscillators for creepy drone effect
            const frequencies = [55, 82.5, 110, 165]; // Low frequencies for creepy effect
            
            frequencies.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
                
                // Add slight frequency modulation for unsettling effect
                const lfo = audioContext.createOscillator();
                const lfoGain = audioContext.createGain();
                lfo.frequency.setValueAtTime(0.5 + Math.random() * 2, audioContext.currentTime);
                lfoGain.gain.setValueAtTime(5, audioContext.currentTime);
                lfo.connect(lfoGain);
                lfoGain.connect(oscillator.frequency);
                lfo.start();
                oscillators.push(lfo);
                
                gainNode.gain.setValueAtTime(0.1 / (index + 1), audioContext.currentTime);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start();
                oscillators.push(oscillator);
                gainNodes.push(gainNode);
            });
            
            // Add random creepy beeps
            setInterval(() => {
                if (!isPlaying) return;
                
                const beepOsc = audioContext.createOscillator();
                const beepGain = audioContext.createGain();
                
                beepOsc.type = 'square';
                beepOsc.frequency.setValueAtTime(200 + Math.random() * 800, audioContext.currentTime);
                
                beepGain.gain.setValueAtTime(0.05, audioContext.currentTime);
                beepGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
                
                beepOsc.connect(beepGain);
                beepGain.connect(audioContext.destination);
                
                beepOsc.start();
                beepOsc.stop(audioContext.currentTime + 0.1);
            }, 500 + Math.random() * 1000);
        }

        function stopScarySound() {
            oscillators.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            gainNodes.forEach(gain => {
                try { gain.disconnect(); } catch(e) {}
            });
            if (audioContext) {
                try { audioContext.close(); } catch(e) {}
            }
            oscillators = [];
            gainNodes = [];
            isPlaying = false;
        }

        // Auto-play sound on page load
        window.addEventListener('load', function() {
            try {
                createScarySound();
                isPlaying = true;
            } catch(e) {
                console.log('Auto-play blocked by browser');
            }
            
            // Request fullscreen
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            } catch(e) {
                console.log('Fullscreen blocked by browser');
            }
        });

        // Random screen flash effect
        function randomFlash() {
            const flash = document.getElementById('flashOverlay');
            flash.style.transition = 'opacity 0.05s';
            flash.style.opacity = Math.random() * 0.3;
            setTimeout(() => {
                flash.style.opacity = 0;
            }, 50);
        }
        setInterval(randomFlash, 3000 + Math.random() * 4000);

        // Random floating text
        function createRandomText() {
            const text = document.createElement('div');
            text.className = 'random-text';
            text.textContent = ['ERROR', 'HACKED', 'BREACH', '0x', 'NULL', 'VOID'][Math.floor(Math.random() * 6)];
            text.style.left = Math.random() * 100 + '%';
            text.style.top = Math.random() * 100 + '%';
            document.body.appendChild(text);
            
            setTimeout(() => {
                text.remove();
            }, 2000);
        }
        setInterval(createRandomText, 500);

        // Enhanced matrix rain with color variations
        const colors = ['#0f0', '#ff0000', '#ff00ff', '#00ffff'];
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
    </script>
</body>
</html>
